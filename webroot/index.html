<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootanim WebUI</title>
    <style>
        :root {
            --md-sys-color-primary: #4fd8eb;
            --md-sys-color-on-primary: #00363d;
            --md-sys-color-surface: #191c1d;
            --md-sys-color-on-surface: #e1e3e3;
            --md-sys-color-surface-container: #1e2223;
            --md-sys-color-surface-container-high: #24292a;
            --md-sys-color-error: #ffb4ab;
        }
        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        h2 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
            letter-spacing: 0px;
        }
        #status-display {
            font-size: 15px;
            margin-bottom: 24px;
            padding: 8px 12px;
            background-color: var(--md-sys-color-surface-container);
            border-radius: 8px;
            display: inline-block;
        }
        button {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            padding: 16px 24px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 100px;
            width: 100%;
            margin-bottom: 12px;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active { transform: scale(0.98); opacity: 0.8; }
        button:disabled { background-color: var(--md-sys-color-surface-container-high); color: #747778; cursor: not-allowed; }
        
        .btn-secondary {
            background-color: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface);
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 16px;
            margin-bottom: 4px;
            background-color: var(--md-sys-color-surface-container);
            border-radius: 16px;
            cursor: pointer;
            word-break: break-all;
            transition: background-color 0.2s;
        }
        .list-item:active { background-color: var(--md-sys-color-surface-container-high); }
        
        .list-icon {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            flex-shrink: 0;
        }
        .item-text {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        #picker-screen { display: none; }
        #current-path-card {
            background-color: var(--md-sys-color-surface-container-high);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-family: monospace;
            font-size: 13px;
            color: var(--md-sys-color-primary);
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div id="main-screen">
        <h2>Bootanimation Module Without OverlayFS</h2>
         
        <div id="status-display">Checking status...</div>

        <button onclick="openPicker()">Select Custom Bootanimation (.zip)</button>
	<button class="btn-secondary" onclick="confirmAndReset()">Reset Bootanimation</button>
         
        <button id="btn-enable" onclick="confirmAndEnable()" style="display: none;">Enable Custom Bootanimation</button>
        <button id="btn-disable" onclick="confirmAndDisable()" style="display: none;">Disable Custom Bootanimation</button>
    </div>

    <div id="picker-screen">
        <div id="current-path-card"></div>
        <button id="btn-up" class="btn-secondary" onclick="goUp()">Go Up</button>
        <button class="btn-secondary" onclick="closePicker()">Cancel</button>
        
        <div style="height: 8px;"></div>
        <div id="file-list"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
