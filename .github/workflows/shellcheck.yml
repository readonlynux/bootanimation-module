name: ShellCheck

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC2086 -e SC2012 -e SC2162 -e SC2124 -e SC3043 -e SC3037 -e SC3045
        with:
          severity: error
